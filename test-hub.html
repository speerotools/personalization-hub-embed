<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speero Personalization Hub: local test</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>document.write('<link rel="stylesheet" href="dist/embed.css?v=' + Date.now() + '">')</script>
<style>body{margin:0;background:#F3F3EF}</style>

<!--
  Serve the Speero folder, do not open from the filesystem, or the fetches are
  blocked:
      python3 -m http.server 8766 --directory ~/Documents/Speero
      open "http://localhost:8766/Personalization%20Hub/personalization-hub-embed/test-hub.html"
  Query params: ?data=<url>  &nav=off
  The hub nav is the real generated component from Research Recipe Hub/hub-nav,
  wrapped the way the Webflow component wraps it.
-->

<div data-hubnav="" data-current="personalization" data-section="overview" data-ground="light" id="hubnav"></div>
<div id="speero-personalization-hub"></div>

<script>
  const params = new URLSearchParams(location.search);
  window.PERSONALIZATION_HUB_CONFIG = {
    dataUrl: params.get("data") || "../personalization-hub-data/personalization-hub.json"
  };
  const boot = () => { const s = document.createElement("script"); s.src = "dist/embed.js?v=" + Date.now(); document.body.appendChild(s); };
  if (params.get("nav") === "off") boot();
  else fetch("../../Research%20Recipe%20Hub/hub-nav/hub-nav-embed.html").then(r => r.text())
    .then(html => { document.getElementById("hubnav").innerHTML = html; }).finally(boot);
</script>
